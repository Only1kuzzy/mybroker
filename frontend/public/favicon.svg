  </defs>
  <rect width="64" height="64" rx="16" fill="#080912" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <g filter="url(#glow)" fill="url(#grad)">
